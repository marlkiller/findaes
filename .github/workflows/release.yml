name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: ''
            asset_name: findaes-linux
          - os: macos-latest
            target: macos
            ext: ''
            asset_name: findaes-macos
          - os: windows-latest
            target: windows
            ext: .exe
            asset_name: findaes-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on Linux/macOS
        if: matrix.target != 'windows'
        run: |
          make clean
          make

      - name: Build on Windows
        if: matrix.target == 'windows'
        run: |
          choco install mingw -y
          make clean
          make cross

      - name: Rename artifact
        run: mv findaes${{ matrix.ext }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload all assets
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/findaes-linux \
            artifacts/findaes-macos \
            artifacts/findaes-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
