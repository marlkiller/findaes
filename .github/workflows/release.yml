name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext:
            asset_name: findaes-linux
          - os: macos-latest
            target: macos
            ext:
            asset_name: findaes-macos
          - os: windows-latest
            target: windows
            ext: .exe
            asset_name: findaes-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on Linux/macOS
        if: matrix.target != 'windows'
        run: |
          make clean
          make

      - name: Build on Windows
        if: matrix.target == 'windows'
        run: |
          choco install mingw -y
          make clean
          make cross

      - name: Get release ID
        id: get-release
        run: |
          RELEASE_ID=$(gh release view ${{ github.ref_name }} --json id -q '.id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release if not exists
        id: create-release
        run: |
          if ! gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        id: upload-asset
        run: |
          gh release upload ${{ github.ref_name }} findaes${{ matrix.ext }} --clobber --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
