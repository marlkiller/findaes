name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext:
            binary_name: findaes-linux
          - os: macos-latest
            target: macos
            ext:
            binary_name: findaes-macos
          - os: windows-latest
            target: windows
            ext: .exe
            binary_name: findaes-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on Linux/macOS
        if: matrix.target != 'windows'
        run: |
          make clean
          make

      - name: Build on Windows
        if: matrix.target == 'windows'
        run: |
          choco install mingw -y
          make clean
          make cross

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: findaes${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: findaes-linux
          path: ./release-linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: findaes-macos
          path: ./release-macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: findaes-windows
          path: ./release-windows

      - name: List files
        run: |
          ls -la ./release-linux
          ls -la ./release-macos
          ls -la ./release-windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release-linux/findaes
            ./release-macos/findaes
            ./release-windows/findaes.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
