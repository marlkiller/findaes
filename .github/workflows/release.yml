name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            target: windows
            ext: .exe
          - os: ubuntu-latest
            target: linux
            ext:
          - os: macos-latest
            target: macos
            ext:

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on Linux/macOS
        if: matrix.os != 'windows-latest'
        run: |
          make clean
          make

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw -y
          make clean
          make cross

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: findaes-${{ matrix.target }}
          path: findaes${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: findaes-*
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/findaes-linux/findaes
            artifacts/findaes-macos/findaes
            artifacts/findaes-windows/findaes.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
