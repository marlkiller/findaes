name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            cross_compile: false
          - os: macos-latest
            target: macos
            cross_compile: false
          - os: windows-latest
            target: windows
            cross_compile: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set output variables
        id: vars
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            echo "binary_name=findaes.exe" >> $GITHUB_OUTPUT
          else
            echo "binary_name=findaes" >> $GITHUB_OUTPUT
          fi

      - name: Build for Linux/macOS
        if: matrix.cross_compile == false
        run: |
          make clean
          make

      - name: Build for Windows (cross-compile)
        if: matrix.cross_compile == true
        run: |
          choco install mingw
          make clean
          make cross

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: findaes-${{ matrix.target }}
          path: findaes${{ matrix.target == 'windows' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: findaes-*
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/findaes-linux/findaes
            artifacts/findaes-macos/findaes
            artifacts/findaes-windows/findaes.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
