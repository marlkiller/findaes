name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext:
          - os: macos-latest
            target: macos
            ext:
          - os: windows-latest
            target: windows
            ext: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on Linux/macOS
        if: matrix.target != 'windows'
        run: |
          make clean
          make

      - name: Build on Windows
        if: matrix.target == 'windows'
        run: |
          choco install mingw -y
          make clean
          make cross

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: findaes${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
